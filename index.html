<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemon Video</title>

<style>
:root {
    --bg1: #0f0f1a;
    --bg2: #1b1b2f;
    --card: #1f1f38;
    --accent: #5efcff;
    --accent2: #7c7cff;
    --text: #eaeaff;
    --sub: #9aa0ff;
}

* {
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, var(--bg2), var(--bg1));
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 主容器 */
.container {
    width: 92%;
    max-width: 420px;
    background: rgba(31,31,56,0.9);
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 0 40px rgba(94,252,255,0.15);
}

/* 标题 */
h1 {
    text-align: center;
    margin: 0 0 8px;
    font-size: 26px;
    letter-spacing: 1px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--sub);
    margin-bottom: 24px;
}

/* 按钮 */
.link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    background: linear-gradient(135deg, #252550, #1c1c3a);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(124,124,255,0.15);
    transition: all 0.25s ease;
}

.link-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 16px rgba(94,252,255,0.35);
}

/* 图标 */
.icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: bold;
    font-size: 18px;
}

/* 按钮文字 */
.btn-text {
    flex: 1;
}

.btn-title {
    font-size: 16px;
}

.btn-desc {
    font-size: 12px;
    color: #bfc3ff;
}

/* 底部 */
.footer {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: #888cff;
}
</style>
</head>
