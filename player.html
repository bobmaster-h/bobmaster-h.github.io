<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>视频播放器</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1f1f2e 0%, #0b0b12 60%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #fff;
    padding: 24px;
  }

  .player {
    width: 100%;
    max-width: 960px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 16px;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    backdrop-filter: blur(20px);
  }

  video {
    width: 100%;
    border-radius: 16px;
    display: block;
    background: #000;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
  }

  .info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 0 6px;
  }

  .title {
    font-size: 15px;
    color: #eaeaff;
    font-weight: 500;
  }

  .back {
    font-size: 13px;
    color: #8b8fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(139, 143, 255, 0.35);
    background: rgba(139, 143, 255, 0.08);
    transition: all 0.2s ease;
  }

  .back:hover {
    background: rgba(139, 143, 255, 0.18);
    border-color: rgba(139, 143, 255, 0.6);
  }
</style>
</head>
<body>
  <div class="player">
    <video controls playsinline>
      <source src="demo.mp4" type="video/mp4" />
      您的浏览器不支持播放此视频。
    </video>

    <div class="info">
      <div class="title">本地视频播放器</div>
      <a class="back" href="index.html">返回</a>
    </div>
  </div>
</body>
</html>
